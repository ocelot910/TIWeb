<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ti2 · CX II CAS</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
<main>
  <header>
    <div class="header-title">
      <h1>ti2 <span>CX II CAS</span></h1>
      <p id="status" role="status">Opening local storage…</p>
    </div>
    <div id="toolbar" hidden>
      <button id="import" type="button">Import</button>
      <button id="export" type="button">Export</button>
      <button id="save" type="button" disabled>Saved</button>
    </div>
  </header>
  <dialog id="documents" aria-labelledby="documents-title">
    <div class="documents-header">
      <h2 id="documents-title"></h2>
      <form method="dialog"><button id="documents-close">Close</button></form>
    </div>
    <div class="document-location">
      <button id="documents-up" type="button">Up</button>
      <span id="documents-path"></span>
    </div>
    <p id="documents-status" role="status"></p>
    <ul id="document-list"></ul>
    <form id="document-import">
      <label>Document (.tns) <input type="file" accept=".tns" required></label>
      <button id="import-here">Import here</button>
    </form>
  </dialog>
  <form id="setup" hidden>
    <label>Boot ROM <input name="rom" type="file" required></label>
    <label>Installed flash image or both split parts <input name="flash" type="file" multiple required></label>
    <button>Save and start</button>
  </form>
  <section id="calculator" aria-label="Calculator">
    <canvas id="lcd" width="320" height="240" aria-label="Calculator display"></canvas>
    <div id="keypad">
      <img src="keypad.svg" width="252" height="386" alt="" draggable="false">
      <div id="touchpad" role="group" aria-label="Touchpad. Drag to move the cursor, tap an edge to navigate, or tap the center to select.">
        <span id="contact" hidden></span>
      </div>
    </div>
  </section>
</main>
</html>
